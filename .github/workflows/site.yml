name: site

# Builds the website from main and publishes it at https://eugo.io/docs/ganymede/.
# Only once the published site answers with the very files this run built does the last job
# replace the old site at https://eugo-inc.github.io/ganymede/ with pages that send each reader
# to the same page at the new address. Until the eugo-docs environment holds its settings (see
# CONTRIBUTING.md, "Website"), the publish job skips its steps with a warning and the old address
# keeps its site. .github/workflows/old-site.yml puts the old site back when it is needed again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and check the website
        run: python tools/build_site.py build
      - name: Build the redirect site for the old address
        run: python tools/build_site.py redirects
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: site/dist
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: redirects
          path: build/redirects
          retention-days: 7
          if-no-files-found: error

  publish-eugo-io:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: eugo-docs
      url: https://eugo.io/docs/ganymede/
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.readback.outputs.published }}
    env:
      # Secrets, so that the logs of this public repository never show them.
      DOCS_AWS_ROLE_ARN: ${{ secrets.DOCS_AWS_ROLE_ARN }}
      DOCS_S3_BUCKET: ${{ secrets.DOCS_S3_BUCKET }}
      DOCS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
      DOCS_AWS_REGION: ${{ vars.DOCS_AWS_REGION }}
      ADDRESS: https://eugo.io/docs/ganymede
    steps:
      - name: Check the environment's settings
        id: settings
        # Until the one-time setup is done, the run stays green and says so: nothing is
        # uploaded, and the redirects job, which needs published=true, does not run.
        run: |
          missing=""
          for name in DOCS_AWS_ROLE_ARN DOCS_S3_BUCKET DOCS_CLOUDFRONT_DISTRIBUTION_ID DOCS_AWS_REGION; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::the eugo-docs environment lacks:$missing (CONTRIBUTING.md, Website). Nothing was published; the old address keeps its site."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: dist
      - if: steps.settings.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.DOCS_AWS_ROLE_ARN }}
          aws-region: ${{ env.DOCS_AWS_REGION }}
      - name: Upload the site under docs/ganymede/
        if: steps.settings.outputs.ready == 'true'
        # Astro's hashed files go first and nothing of theirs is deleted yet, so a page, old or
        # new, never names a file that is missing; the last step removes the ones no page names.
        # Then one sync per kind of file, each deleting only what its own filter covers: the
        # pages and other files (cached for five minutes), the notebooks, the gzipped sitemap, the
        # Markdown copies and the text files (llms.txt, llms-full.txt), each with its own content
        # type. Every file of dist/ matches exactly one of the six filters.
        run: |
          target="s3://$DOCS_S3_BUCKET/docs/ganymede"
          aws s3 sync dist/_astro/ "$target/_astro/" --size-only --no-follow-symlinks --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist/ "$target/" --delete --no-follow-symlinks --only-show-errors \
            --exclude '_astro/*' --exclude '*.md' --exclude '*.ipynb' --exclude '*.gz' --exclude '*.txt' \
            --cache-control 'public, max-age=300'
          aws s3 sync dist/ "$target/" --delete --no-follow-symlinks --only-show-errors \
            --exclude '*' --include '*.ipynb' --content-type 'application/x-ipynb+json' \
            --cache-control 'public, max-age=300'
          aws s3 sync dist/ "$target/" --delete --no-follow-symlinks --only-show-errors \
            --exclude '*' --include '*.gz' --content-type 'application/gzip' \
            --cache-control 'public, max-age=300'
          aws s3 sync dist/ "$target/" --delete --no-follow-symlinks --only-show-errors \
            --exclude '*' --include '*.md' --content-type 'text/markdown; charset=utf-8' \
            --cache-control 'public, max-age=300'
          aws s3 sync dist/ "$target/" --delete --no-follow-symlinks --only-show-errors \
            --exclude '*' --include '*.txt' --content-type 'text/plain; charset=utf-8' \
            --cache-control 'public, max-age=300'
      - name: Drop the cached copies of the site's addresses
        if: steps.settings.outputs.ready == 'true'
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "$DOCS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/docs/ganymede' '/docs/ganymede/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DOCS_CLOUDFRONT_DISTRIBUTION_ID" --id "$id"
          echo "invalidation completed"
      - name: Read the live site back
        id: readback
        if: steps.settings.outputs.ready == 'true'
        # The host answers any unknown address with a page of its own and status 200, so a
        # status alone proves nothing: each address must answer with the bytes just built.
        run: |
          check() {  # $1 address under the site, $2 built file, $3 Accept header
            local code
            code="$(curl -sS -H "Accept: $3" -o live.out -w '%{http_code}' "$ADDRESS/$1")" || return 1
            [ "$code" = 200 ] && cmp -s live.out "dist/$2" && echo "same as built: /$1 [$3]"
          }
          notebook=demo_notebooks/case_studies/goes16_netcdf
          ok=""
          for attempt in 1 2 3 4 5; do
            if check "" index.html 'text/html' \
              && check faq/ faq/index.html 'text/html' \
              && check "$notebook/" "$notebook/index.html" 'text/html' \
              && check "$notebook/goes16_netcdf.ipynb" "$notebook/goes16_netcdf.ipynb" '*/*' \
              && check llms.txt llms.txt '*/*' \
              && check llms-full.txt llms-full.txt '*/*' \
              && check faq/ faq/index.md 'text/markdown'; then
              ok=yes; break
            fi
            echo "attempt $attempt: the live site is not yet the built one; waiting"
            sleep 30
          done
          [ -n "$ok" ] || { echo "::error::the live site does not answer with the built files"; exit 1; }
          miss="$(curl -sS -o /dev/null -w '%{http_code}' "$ADDRESS/no-such-page-$GITHUB_RUN_ID/")"
          bare="$(curl -sS -o /dev/null -w '%{http_code}' "$ADDRESS")"
          echo "a missing page: $miss; the address without its slash: $bare"
          [ "$miss" = 404 ] || { echo "::error::a missing page answers $miss, not 404"; exit 1; }
          [ "$bare" = 301 ] || { echo "::error::$ADDRESS answers $bare, not 301"; exit 1; }
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Remove Astro's files that no page names any more
        if: steps.settings.outputs.ready == 'true'
        # A browser may keep a page for five minutes after the cached copies were dropped, so
        # the hashed files that page names stay that long; then only the new build's remain.
        run: |
          sleep 330
          aws s3 sync dist/_astro/ "s3://$DOCS_S3_BUCKET/docs/ganymede/_astro/" --delete --size-only \
            --no-follow-symlinks --only-show-errors --cache-control 'public, max-age=31536000, immutable'

  redirects:
    needs: publish-eugo-io
    if: github.ref == 'refs/heads/main' && needs.publish-eugo-io.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: redirects
          path: redirects
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: redirects
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
