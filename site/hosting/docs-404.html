<!-- The page eugo.io answers, with status 404, for an address under /docs/ that no documentation
     site holds. It is served at the address that was asked for, at any depth, so it loads
     nothing (no style sheet, font, script or image) and links by paths from the host's root.
     It is not part of the ganymede website's build: whoever runs the host uploads it once, as
     docs/404.html beside the documentation sites (CONTRIBUTING.md, "Website"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Page not found | Eugo documentation</title>
<style>
  :root { --ground: #ffffff; --ink: #0b1020; --muted: #4a4f63; --line: #e4e1ee; --link: #6d28d9; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #080d17; --ink: #f2f3f8; --muted: #a9b0c3; --line: #232a3b; --link: #c4a1ff; }
  }
  html { background: var(--ground); color: var(--ink); }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: 4px;
    background: linear-gradient(90deg, #7c3aed, #048196);
  }
  main { max-width: 34rem; padding: 2rem 1.5rem; }
  h1 { margin: 0 0 0.75rem; font-size: 1.75rem; line-height: 1.2; }
  p { margin: 0 0 1rem; color: var(--muted); }
  ul { margin: 0 0 1.5rem; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  li { padding: 0.75rem 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  a { color: var(--link); font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>No documentation page has this address. It may have moved; start from one of these:</p>
<ul>
<li><a href="/docs/ganymede/">ganymede</a>: open notebooks for HPC, Ray and geospatial Python</li>
<li><a href="/docs/pairbench/latest/">pairbench</a>: tells real benchmark differences from noise</li>
</ul>
<p><a href="/">eugo.io</a></p>
</main>
</body>
</html>
